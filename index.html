<style>
  :root { --bg:#f6f5f1; --ink:#131417; --muted:#5b5e66; --line:#dcdad3; --signal:#f0bf2a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#131417; --ink:#f0efe9; --muted:#9a9ca3; --line:#2a2c31; }
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  main { max-width:520px; width:100%; }
  .mark { width:28px; height:4px; background:var(--signal); border-radius:2px; margin-bottom:28px; }
  .domain { font-size:14px; letter-spacing:.04em; color:var(--muted); margin-bottom:10px; }
  h1 { font-size:clamp(24px,5vw,32px); line-height:1.2; font-weight:650; letter-spacing:-.01em; margin-bottom:16px; }
  p { font-size:16px; line-height:1.6; color:var(--muted); }
  footer { margin-top:32px; padding-top:16px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"></div>

  <footer>© Sayder Karakaplan</footer>

</body>
